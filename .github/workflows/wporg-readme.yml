name: Publish WordPress.org readme

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-readme:
    name: Publish approved FAQ metadata
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: wordpress.org
    concurrency:
      group: wordpress-org-deployment
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Subversion
        run: |
          sudo apt-get update
          sudo apt-get install --yes subversion

      - name: Verify metadata publication guards
        run: ./scripts/test-wporg-readme.sh

      - name: Publish only the two canonical readmes
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: ./scripts/publish-wporg-readme.sh

      - name: Verify complete stable-tag parity
        run: ./scripts/verify-svn-sync.sh
