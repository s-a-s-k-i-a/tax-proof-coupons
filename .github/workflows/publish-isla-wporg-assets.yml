name: Publish approved Isla WordPress.org assets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-approved-isla-wordpress-org-assets
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.slug }}
    runs-on: ubuntu-latest
    environment: wordpress.org
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - slug: taxproof-coupons-for-woocommerce
            banner_1544: 482edcac37f037a4fd2bdb9adc5bd8782a5f9c74fb0e1fa6924aad5b97fc4b0d
            banner_772: 4ee69311b837dcca42d6a1c7a6c9f28a5f7744b6968b7ed7a558a4d46467fe6a
            icon_256: dcff2f4fa1d68d2ba98571bbb2a4af29f4a95f9293d57bd75ec852ce44fdf4b2
            icon_128: fd97ef04354fbf4578fd82b2637f6a8acb01b1ba34a0328809cacd2b8d628f1d
          - slug: omppm-override-phpmail-mailpoet
            banner_1544: f44f1696a9e4b9dd109912b1bdaa23d4980246c7bd87fb1581550cca68c29627
            banner_772: b17d2a8f2d60a814032655fd4199277155c30f2495832d819ae27f8506d0c570
            icon_256: ba0bab31ead2b221df970affe6e6032df2e2b1cd4c8801392d2a5bdc3beab955
            icon_128: 2cc095af3b8902c1c358cbafa82c2f3dee127b79be08d27dcd2df2e51c2785dd
          - slug: bunny-fonts-for-divi
            banner_1544: cf6879c0a9617e262a15be20cfd30195f1c7c65a20c58630932ad098cbff1c63
            banner_772: 6894b13ef7034b629c85b26f86681963ee312a78a4e3b078693d21f284bedce3
            icon_256: 425041c337b13160debbb5bb1f17358c0af80edd5f0b3d18094491720da6ea7a
            icon_128: 7ace03d8cd2901a4c6df7f321ab0ce9f9aaaa419eeb84c980c16f4cfa633afd4
          - slug: responsive-mobile-select-menu
            banner_1544: c7e60c6f64f3249be931b2f9df6f379d2fee6517d0c1c7c73036cc9f72c8d405
            banner_772: 04ed609263a62505c8dda7c138bcd2113c835458bd00f089cd68d2652d458413
            icon_256: b255724ff3d966c348089667778f5edd91942e019f5d7ce7085459c4988fd4b5
            icon_128: ea9d5b02d9aae97806a1ae6fece18c09c3f7167e9a9b01b52c62ab804d0e7e96
          - slug: slitweb-divi-lightbox-for-jetpack
            banner_1544: c87e4eb4b86349d5a6459574465f43ec901e0739ecac99179e94bdd8538d213d
            banner_772: 593b238a7be41cae373e03ae762835e4dd10acccc5961c432f1d186539ae2711
            icon_256: d50c6a44c7c66c7fba5184741624bb8e9873d1044d279c2af6881bb3396d1dee
            icon_128: 048557154b89f86e52a9785d460e1586a28b10c55ac6596b3cf522c8af1a625b
          - slug: virtual-candles
            banner_1544: bf81dd00b2480a61f4c9992ff708c5c83da5e9baa004ba3df90336f85983eacf
            banner_772: dbe4c142218ec74bd360301493879258a833b277a0773df1c6185b8eb64ab592
            icon_256: 640c4cc9a19c942f7371f8454fda73fb1e5d7b6e7707595ef5dc481433dc52b1
            icon_128: fea86ff9cdee19f5d5789ababbda37445193f3ba5a1f1f2a6a655ac4af4270ff

    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
      STAGING_BASE_URL: https://isla-stud.io/wp-content/uploads/wporg-branding-364

    steps:
      - name: Check out the plugin asset directory
        run: svn checkout "https://plugins.svn.wordpress.org/${{ matrix.slug }}/assets" assets

      - name: Download and verify the approved assets
        shell: bash
        run: |
          set -euo pipefail

          find assets -maxdepth 1 -type f \( -name 'banner-*' -o -name 'icon-*' \) -delete

          for file in banner-1544x500.png banner-772x250.png icon-256x256.png icon-128x128.png; do
            curl --fail --location --silent --show-error \
              "${STAGING_BASE_URL}/${{ matrix.slug }}/${file}" \
              --output "assets/${file}"
          done

          cat > checksums.sha256 <<'CHECKSUMS'
          ${{ matrix.banner_1544 }}  assets/banner-1544x500.png
          ${{ matrix.banner_772 }}  assets/banner-772x250.png
          ${{ matrix.icon_256 }}  assets/icon-256x256.png
          ${{ matrix.icon_128 }}  assets/icon-128x128.png
          CHECKSUMS

          sha256sum --check checksums.sha256
          svn add --force assets
          svn status assets

      - name: Publish the verified assets to WordPress.org
        shell: bash
        run: |
          set -euo pipefail
          svn commit assets \
            --username "${SVN_USERNAME}" \
            --password "${SVN_PASSWORD}" \
            --non-interactive \
            --no-auth-cache \
            --message "Refresh plugin artwork in the approved Isla Studio design system"
